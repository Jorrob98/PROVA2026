name: Deploy Minecraft 3D to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'minecraft-isola-3d/**'
      - '.github/workflows/minecraft-isola-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./minecraft-isola-3d

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
