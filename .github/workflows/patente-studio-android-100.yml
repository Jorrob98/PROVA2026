name: Build Patente Studio Tablet 1.0.0
on:
  push:
    branches: [main]
    paths: ['patente-studio-android/source-1.0.0.b64']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android project
        run: |
          mkdir -p /tmp/psandroid
          base64 -d patente-studio-android/source-1.0.0.b64 >/tmp/psandroid/source.zip
          unzip -q /tmp/psandroid/source.zip -d /tmp/psandroid
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile release
        working-directory: /tmp/psandroid
        run: gradle :app:assembleRelease --no-daemon
      - name: Sign and validate APK
        working-directory: /tmp/psandroid
        run: |
          python3 -m pip install cryptography
          bash ci-sign.sh
      - name: Publish APK and encrypted key recovery
        run: |
          cp /tmp/psandroid/out/* patente-studio-android/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patente-studio-android/
          git commit -m "Publish signed Patente Studio Tablet 1.0.0"
          git pull --rebase
          git push
