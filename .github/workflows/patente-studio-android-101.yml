name: Build Patente Studio Tablet 1.0.1
on:
  push:
    branches: [main]
    paths: ['patente-studio-android/source-1.0.1.b64']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile
        run: |
          mkdir -p /tmp/psandroid
          base64 -d patente-studio-android/source-1.0.1.b64 >/tmp/psandroid/source.zip
          unzip -q /tmp/psandroid/source.zip -d /tmp/psandroid
          export ANDROID_HOME=/usr/local/lib/android/sdk
          cd /tmp/psandroid
          gradle :app:assembleRelease --no-daemon
          mkdir -p /tmp/android-out
          cp app/build/outputs/apk/release/app-release-unsigned.apk /tmp/android-out/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/android-out/
      - uses: actions/upload-artifact@v4
        with:
          name: android-101-signing-kit
          path: /tmp/android-out/
          retention-days: 7
