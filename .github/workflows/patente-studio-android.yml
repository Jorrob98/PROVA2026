name: Build Patente Studio Android
on:
  push:
    branches: [main]
    paths: ['patente-studio-android/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build unsigned release
        working-directory: patente-studio-android
        run: gradle --no-daemon :app:assembleRelease
      - name: Prepare offline signing kit
        run: |
          mkdir -p android-out
          cp patente-studio-android/app/build/outputs/apk/release/app-release-unsigned.apk android-out/
          cp "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar" android-out/
      - uses: actions/upload-artifact@v4
        with:
          name: patente-studio-android-build
          path: android-out/
          retention-days: 7
