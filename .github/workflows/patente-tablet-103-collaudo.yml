name: Patente Studio Tablet 1.0.3 isolated debug build
on:
  push:
    branches: [patente-tablet-103-collaudo]
    paths: ['.github/workflows/patente-tablet-103-collaudo.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract exact published 1.0.2 source for inspection
        run: |
          mkdir -p /tmp/psout
          unzip -q patente-studio-android/source-1.0.2.zip -d /tmp/psout
          find /tmp/psout -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: tablet-102-exact-source
          path: /tmp/psout
          retention-days: 7
          if-no-files-found: error
