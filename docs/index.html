<title>Jorrob Minecraft Base Planner</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a7cde8;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#f4f8fc}
#app{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
.panel{position:fixed;z-index:8;left:12px;top:12px;width:min(370px,calc(100vw - 24px));padding:13px;border-radius:15px;background:rgba(7,17,29,.88);backdrop-filter:blur(12px);border:1px solid rgba(126,194,255,.25);box-shadow:0 15px 45px rgba(0,0,0,.28)}
h1{font-size:17px;margin:0 0 3px}.sub{font-size:12px;line-height:1.4;opacity:.82}.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
button{appearance:none;border:1px solid rgba(130,198,255,.28);background:#102a43;color:#fff;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer}
button:hover{background:#153752}
.status{margin-top:9px;font-size:10px;opacity:.7;line-height:1.35}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:9px;font-size:10px;opacity:.86}.leg{display:flex;align-items:center;gap:5px}.dot{width:9px;height:9px;border-radius:2px}
.coord{position:fixed;z-index:8;right:12px;bottom:12px;padding:8px 10px;border-radius:9px;background:rgba(7,17,29,.83);border:1px solid rgba(126,194,255,.22);font-size:11px}
#loading{position:fixed;z-index:20;inset:0;display:grid;place-items:center;background:#08111d;text-align:center;font-weight:750}
#loading small{display:block;margin-top:7px;opacity:.65;font-weight:500}
@media(max-width:650px){.panel{padding:10px}.coord{font-size:10px}}
</style>

const heights=window.pako.inflate(compressed);
if(heights.length!==N*N) throw new Error('Heightmap non valida');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xa7cde8);
scene.fog=new THREE.Fog(0xa7cde8,620,1050);

const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,1600);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.45));
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.065;
controls.minDistance=65;
controls.maxDistance=850;
controls.maxPolarAngle=Math.PI*.495;

scene.add(new THREE.HemisphereLight(0xeaf7ff,0x534837,2.0));
const sun=new THREE.DirectionalLight(0xfff1cb,1.8);
sun.position.set(-220,330,180);
scene.add(sun);

// Single efficient terrain mesh: 160,801 vertices / 320,000 triangles.
const geo=new THREE.PlaneGeometry(N-1,N-1,N-1,N-1);
geo.rotateX(-Math.PI/2);
const p=geo.attributes.position;
const colors=new Float32Array(p.count*3);
const c=new THREE.Color();

function H(ix,iz){return heights[ix*N+iz]}
function setColor(i,y){
  if(y<=SEA) c.setHex(y>=55?0xcdbd83:0x837b6e);
  else if(y>=118) c.setHex(0x77756f);
  else if(y>=104) c.setHex(0x708452);
  else c.setHex(0x5f9348);
  colors[i*3]=c.r;colors[i*3+1]=c.g;colors[i*3+2]=c.b;
}
for(let iz=0;iz<N;iz++){
  for(let ix=0;ix<N;ix++){
    const vi=iz*N+ix;
    const y=H(ix,iz);
    p.setY(vi,y);
    setColor(vi,y);
  }
}
p.needsUpdate=true;
geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
geo.computeVertexNormals();

const terrainMat=new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true,side:THREE.DoubleSide});
const terrain=new THREE.Mesh(geo,terrainMat);
scene.add(terrain);

// Water plane.
const water=new THREE.Mesh(
  new THREE.PlaneGeometry(N,N),
  new THREE.MeshPhysicalMaterial({color:0x2d79d5,transparent:true,opacity:.44,roughness:.15,metalness:0,depthWrite:false,side:THREE.DoubleSide})
);
water.rotation.x=-Math.PI/2;
water.position.y=SEA+.55;
scene.add(water);

// Center marker.
const centerY=H(R,R);
const marker=new THREE.Mesh(
  new THREE.CylinderGeometry(1.25,1.25,8,16),
  new THREE.MeshLambertMaterial({color:0xff5148})
);
marker.position.set(0,centerY+5,0);
scene.add(marker);

function home(){camera.position.set(340,245,340);controls.target.set(0,86,0);controls.update()}
function top(){camera.position.set(0,610,.01);controls.target.set(0,70,0);controls.update()}
home();

document.getElementById('home').onclick=home;
document.getElementById('top').onclick=top;
document.getElementById('waterBtn').onclick=e=>{water.visible=!water.visible;e.target.textContent='Acqua '+(water.visible?'ON':'OFF')};
document.getElementById('gridBtn').onclick=e=>{terrainMat.wireframe=!terrainMat.wireframe;terrainMat.needsUpdate=true;e.target.textContent='Griglia '+(terrainMat.wireframe?'ON':'OFF')};

const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),coord=document.getElementById('coord');
renderer.domElement.addEventListener('pointermove',ev=>{
  mouse.x=ev.clientX/innerWidth*2-1;mouse.y=-(ev.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObject(terrain,false)[0];
  if(hit){
    const q=hit.point;
    coord.textContent='X '+Math.round(CX+q.x)+' · Y '+Math.round(q.y)+' · Z '+Math.round(CZ+q.z);
  }
});

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

document.getElementById('loading').remove();
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}
animate();
</script>
</body>
</html>
